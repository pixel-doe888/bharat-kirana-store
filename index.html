<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameForge 50 — Free Online Games</title>
<meta name="description" content="Play 50 free browser games online.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070b14;color:#fff;min-height:100vh
}
header{
  padding:28px 5%;background:linear-gradient(135deg,#111827,#07111f);
  border-bottom:1px solid #263247;position:sticky;top:0;z-index:5
}
.logo{font-size:30px;font-weight:900}
.logo span{color:#65f7b1}
.subtitle{color:#8fa0b8;margin-top:6px}
.controls{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:22px
}
input,select{
  background:#111a29;color:#fff;border:1px solid #34445d;
  padding:13px 16px;border-radius:12px;outline:none
}
input{flex:1;min-width:220px}
.categories{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:15px
}
.cat{
  border:1px solid #34445d;background:#111a29;color:#cbd5e1;
  padding:8px 13px;border-radius:999px;cursor:pointer
}
.cat.active,.cat:hover{background:#65f7b1;color:#06100c;border-color:#65f7b1}
main{padding:35px 5%;max-width:1500px;margin:auto}
h1{font-size:38px;margin-bottom:8px}
.count{color:#8191a8;margin-bottom:25px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px
}
.card{
  background:linear-gradient(145deg,#111a29,#0b1220);
  border:1px solid #26344a;border-radius:18px;padding:20px;
  min-height:190px;transition:.2s;cursor:pointer
}
.card:hover{transform:translateY(-5px);border-color:#65f7b1;box-shadow:0 12px 35px #0008}
.icon{font-size:45px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:8px}
.card p{color:#8798af;font-size:14px;line-height:1.5}
.tag{
  display:inline-block;margin-top:14px;padding:5px 9px;border-radius:8px;
  background:#182437;color:#65f7b1;font-size:12px
}
.play{
  display:block;margin-top:15px;width:100%;padding:10px;border:0;
  border-radius:10px;background:#65f7b1;color:#06100c;font-weight:800;cursor:pointer
}

/* GAME MODAL */
.modal{
  position:fixed;inset:0;background:#02050bcc;backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:20
}
.modal.show{display:flex}
.gamebox{
  width:min(950px,100%);background:#0b1220;border:1px solid #34445d;
  border-radius:20px;padding:20px;box-shadow:0 25px 80px #000
}
.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close{
  background:#202c3e;color:#fff;border:0;border-radius:10px;
  padding:9px 13px;cursor:pointer;font-size:18px
}
canvas{
  display:block;width:100%;max-width:800px;height:auto;aspect-ratio:16/9;
  background:#03070d;border-radius:14px;margin:auto;border:1px solid #26344a
}
.info{
  text-align:center;color:#94a3b8;margin-top:13px;line-height:1.6
}
.score{color:#65f7b1;font-weight:bold}
.touch{
  display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap
}
.touch button{
  background:#172337;color:white;border:1px solid #35465e;
  padding:12px 20px;border-radius:10px
}
footer{text-align:center;color:#65758b;padding:40px}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 Game<span>Forge</span> 50</div>
  <div class="subtitle">50 different playable browser games</div>

  <div class="controls">
    <input id="search" placeholder="Search games...">
    <select id="sort">
      <option value="name">Sort by name</option>
      <option value="category">Sort by category</option>
    </select>
  </div>

  <div class="categories" id="categories"></div>
</header>

<main>
  <h1>All Games</h1>
  <div class="count" id="count"></div>
  <div class="grid" id="games"></div>
</main>

<footer>
  GameForge 50 • HTML5 Browser Games
</footer>

<div class="modal" id="modal">
  <div class="gamebox">
    <div class="gamehead">
      <div>
        <h2 id="gameTitle"></h2>
        <div id="gameCategory" class="subtitle"></div>
      </div>
      <button class="close" onclick="closeGame()">✕</button>
    </div>

    <canvas id="canvas" width="800" height="450"></canvas>
    <div class="info" id="gameInfo"></div>
    <div class="touch" id="touch"></div>
  </div>
</div>

<script>
const games=[
["Meteor Dodge","Arcade","☄️","Move left/right and avoid meteors.","meteor"],
["Coin Rush","Arcade","🪙","Collect as many coins as possible.","coin"],
["Snake Neon","Arcade","🐍","Eat the dots and grow.","snake"],
["Brick Breaker","Arcade","🧱","Break every brick.","brick"],
["Flappy Rocket","Arcade","🚀","Fly through the gaps.","flappy"],
["Space Invaders Mini","Shooter","👾","Destroy the invading aliens.","invaders"],
["Asteroid Blaster","Shooter","🌌","Blast incoming asteroids.","asteroids"],
["Target Hunter","Shooter","🎯","Shoot targets before time runs out.","targets"],
["Cannon Commander","Shooter","💣","Fire your cannon at targets.","cannon"],
["Laser Grid","Shooter","🔫","Fire lasers at enemies.","laser"],
["Highway Racer","Racing","🏎️","Avoid traffic and survive.","racer"],
["Traffic Weave","Racing","🚗","Weave between cars.","traffic"],
["Drift Dots","Racing","🏁","Control your drifting car.","drift"],
["Rocket Landing","Simulation","🛸","Land your rocket safely.","landing"],
["Mini Golf","Sports","⛳","Hit the ball into the hole.","golf"],
["Penalty Kick","Sports","⚽","Score against the goalkeeper.","penalty"],
["Basket Shot","Sports","🏀","Time your basketball shots.","basket"],
["Tennis Bounce","Sports","🎾","Return the tennis ball.","tennis"],
["Boxing Reflex","Sports","🥊","React quickly to attacks.","boxing"],
["Memory Match","Puzzle","🧠","Find matching pairs.","memory"],
["2048 Mini","Puzzle","🔢","Combine matching numbers.","2048"],
["Color Switch","Puzzle","🎨","Press the correct color key.","color"],
["Math Sprint","Puzzle","➗","Solve quick math questions.","math"],
["Word Scramble","Puzzle","🔤","Unscramble the word.","word"],
["Reaction Test","Puzzle","⚡","React when the screen changes.","reaction"],
["Quick Count","Puzzle","🔵","Click the requested number of dots.","count"],
["Pattern Master","Puzzle","🟩","Repeat the pattern.","pattern"],
["Maze Escape","Adventure","🗺️","Escape the maze.","maze"],
["Treasure Dig","Adventure","💎","Find hidden treasure.","treasure"],
["Dungeon Doors","Adventure","🚪","Choose the correct doors.","doors"],
["Knight Quest","Adventure","⚔️","Defeat enemies on your quest.","knight"],
["Island Survivor","Adventure","🏝️","Collect resources and survive.","island"],
["Zombie Escape","Action","🧟","Escape the zombies.","zombie"],
["Ninja Dash","Action","🥷","Jump over obstacles.","ninja"],
["Robot Arena","Action","🤖","Destroy enemy robots.","robot"],
["Sword Blocks","Action","⚔️","Destroy incoming blocks.","sword"],
["Fireball Dodge","Action","🔥","Dodge the fireballs.","fire"],
["Tower Defense","Strategy","🏰","Defend your base.","tower"],
["Grid Conquest","Strategy","♟️","Capture the grid.","grid"],
["Mine Sweeper","Strategy","💣","Find safe tiles.","mine"],
["Connect Four","Board","🔴","Connect four pieces.","connect"],
["Tic Tac Toe","Board","❌","Beat the computer.","ttt"],
["Dots Duel","Board","🔷","Claim dots on the board.","dots"],
["Falling Blocks","Arcade","🟦","Catch falling blocks.","blocks"],
["Bubble Pop","Arcade","🫧","Pop the bubbles.","bubble"],
["Whack-a-Mole","Arcade","🐹","Hit the mole quickly.","mole"],
["Fishing Frenzy","Simulation","🎣","Catch fish for points.","fish"],
["Farm Clicker","Simulation","🌾","Grow your farm.","farm"],
["Volcano Run","Action","🌋","Run away from the volcano.","volcano"],
["Snowball Survival","Action","❄️","Avoid rolling snowballs.","snow"]
];

const icons={};
games.forEach(g=>icons[g[0]]=g[2]);

const cats=["All",...new Set(games.map(g=>g[1]))];
let selected="All";

const catBox=document.getElementById("categories");
cats.forEach(c=>{
  const b=document.createElement("button");
  b.className="cat"+(c==="All"?" active":"");
  b.textContent=c;
  b.onclick=()=>{
    selected=c;
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
  catBox.appendChild(b);
});

function render(){
  let q=document.getElementById("search").value.toLowerCase();
  let list=games.filter(g=>
    (selected==="All"||g[1]===selected)&&
    (g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q))
  );

  if(document.getElementById("sort").value==="category")
    list.sort((a,b)=>a[1].localeCompare(b[1]));
  else list.sort((a,b)=>a[0].localeCompare(b[0]));

  document.getElementById("count").textContent=
    `${list.length} game${list.length!==1?"s":""} available`;

  document.getElementById("games").innerHTML=list.map(g=>`
    <div class="card" onclick="openGame('${g[4]}')">
      <div class="icon">${g[2]}</div>
      <h2>${g[0]}</h2>
      <p>${g[3]}</p>
      <span class="tag">${g[1]}</span>
      <button class="play">PLAY NOW</button>
    </div>
  `).join("");
}

document.getElementById("search").oninput=render;
document.getElementById("sort").onchange=render;
render();

/* ================= GAME ENGINE ================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const keys={};
let game=null,raf=0;

document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  keys[e.code]=true;
});
document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
  keys[e.code]=false;
});

function clear(){
  ctx.fillStyle="#03070d";
  ctx.fillRect(0,0,800,450);
}
function text(t,x,y,size=22){
  ctx.fillStyle="#fff";
  ctx.font=`bold ${size}px Arial`;
  ctx.fillText(t,x,y);
}
function circle(x,y,r,fill){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fill;ctx.fill();
}
function rect(x,y,w,h,fill){
  ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);
}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}

function openGame(id){
  cancelAnimationFrame(raf);
  game={id,score:0,time:0,over:false};
  document.getElementById("modal").classList.add("show");

  let g=games.find(x=>x[4]===id);
  document.getElementById("gameTitle").textContent=g[0];
  document.getElementById("gameCategory").textContent=g[1];
  document.getElementById("gameInfo").innerHTML=
    "Keyboard controls • Press R to restart";

  setupTouch(id);
  startGame(id);
}

function closeGame(){
  document.getElementById("modal").classList.remove("show");
  cancelAnimationFrame(raf);
  game=null;
}

function setupTouch(id){
  const t=document.getElementById("touch");
  t.innerHTML="";
  ["←","↑","↓","→","SPACE"].forEach(k=>{
    let b=document.createElement("button");
    b.textContent=k;
    let key=k==="SPACE"?" ":k;
    b.onmousedown=()=>keys[key]=true;
    b.onmouseup=()=>keys[key]=false;
    b.ontouchstart=e=>{e.preventDefault();keys[key]=true};
    b.ontouchend=e=>{e.preventDefault();keys[key]=false};
    t.appendChild(b);
  });
}

function startGame(id){
  const fn=engines[id]||simpleGame;
  fn();
}

/* 1 METEOR DODGE */
function meteor(){
 let p={x:400,y:390},obs=[],score=0;
 for(let i=0;i<9;i++)obs.push({x:Math.random()*760+20,y:-Math.random()*500,r:12+Math.random()*15,s:2+Math.random()*3});
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)p.x-=6;
  if(keys.ArrowRight||keys.d)p.x+=6;
  p.x=Math.max(20,Math.min(780,p.x));
  circle(p.x,p.y,15,"#65f7b1");
  obs.forEach(o=>{
   o.y+=o.s;
   if(o.y>470){o.y=-30;o.x=Math.random()*760+20;score++}
   circle(o.x,o.y,o.r,"#ff5577");
   if(dist(p.x,p.y,o.x,o.y)<25)game.over=true;
  });
  text("Score: "+score,20,35);
  if(game.over){text("GAME OVER — Press R",285,220,28);if(keys.r){score=0;game.over=false}}
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 2 COIN RUSH */
function coin(){
 let p={x:400,y:225},c={x:100,y:100},score=0;
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)p.x-=5;
  if(keys.ArrowRight||keys.d)p.x+=5;
  if(keys.ArrowUp||keys.w)p.y-=5;
  if(keys.ArrowDown||keys.s)p.y+=5;
  p.x=Math.max(15,Math.min(785,p.x));p.y=Math.max(15,Math.min(435,p.y));
  circle(p.x,p.y,15,"#65f7b1");
  circle(c.x,c.y,11,"#ffd84d");
  if(dist(p.x,p.y,c.x,c.y)<25){
   score++;c={x:20+Math.random()*760,y:20+Math.random()*410};
  }
  text("Coins: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 3 SNAKE */
function snake(){
 let body=[{x:10,y:10}],dir={x:1,y:0},food={x:15,y:8},score=0,t=0;
 function loop(){
  clear();t++;
  if(keys.ArrowLeft&&dir.x!==1)dir={x:-1,y:0};
  if(keys.ArrowRight&&dir.x!==-1)dir={x:1,y:0};
  if(keys.ArrowUp&&dir.y!==1)dir={x:0,y:-1};
  if(keys.ArrowDown&&dir.y!==-1)dir={x:0,y:1};
  if(t%7===0){
   let h={x:body[0].x+dir.x,y:body[0].y+dir.y};
   if(h.x<0||h.x>=40||h.y<0||h.y>=22||
      body.some(b=>b.x===h.x&&b.y===h.y))game.over=true;
   body.unshift(h);
   if(h.x===food.x&&h.y===food.y){
    score++;food={x:Math.floor(Math.random()*40),y:Math.floor(Math.random()*22)};
   }else body.pop();
  }
  body.forEach((b,i)=>rect(b.x*20,b.y*20,19,19,i?"#35c98b":"#65f7b1"));
  rect(food.x*20,food.y*20,19,19,"#ff5577");
  text("Score: "+score,20,35);
  if(game.over)text("GAME OVER — Press R",275,220,28);
  if(game.over&&keys.r){body=[{x:10,y:10}];dir={x:1,y:0};score=0;game.over=false}
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 4 BRICK BREAKER */
function brick(){
 let x=400,y=400,dx=4,dy=-4,p=330,br=[];
 for(let r=0;r<4;r++)for(let c=0;c<10;c++)
  br.push({x:55+c*70,y:50+r*25,on:true});
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)p-=7;
  if(keys.ArrowRight||keys.d)p+=7;
  p=Math.max(0,Math.min(670,p));
  x+=dx;y+=dy;
  if(x<8||x>792)dx*=-1;if(y<8)dy*=-1;
  if(y>425&&x>p&&x<p+130)dy=-Math.abs(dy);
  if(y>450)game.over=true;
  br.forEach(b=>{
   if(b.on&&x>b.x&&x<b.x+65&&y>b.y&&y<b.y+20){b.on=false;dy*=-1;game.score++}
   if(b.on)rect(b.x,b.y,65,20,"#65f7b1");
  });
  rect(p,420,130,12,"#fff");circle(x,y,8,"#ff5577");
  text("Score: "+game.score,20,35);
  if(game.over)text("GAME OVER — Press R",280,220,28);
  if(game.over&&keys.r){location.reload()}
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 5 FLAPPY ROCKET */
function flappy(){
 let y=220,vy=0,px=800,gap=170,score=0;
 function loop(){
  clear();
  if(keys[" "]||keys.ArrowUp){vy=-6;keys[" "]=false}
  vy+=.3;y+=vy;
  px-=3;
  if(px<-70){px=800;gap=100+Math.random()*200;score++}
  rect(px,0,65,gap,"#65f7b1");
  rect(px,gap+130,65,450-gap-130,"#65f7b1");
  circle(160,y,16,"#ffd84d");
  if(y<0||y>450||(
   160>px&&160<px+65&&(y<gap||y>gap+130)))game.over=true;
  text("Score: "+score,20,35);
  if(game.over)text("CRASH — Press R",310,220,28);
  if(game.over&&keys.r){flappy();return}
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 6 INVADERS */
function invaders(){
 let px=400,bullets=[],en=[];
 for(let r=0;r<3;r++)for(let c=0;c<8;c++)en.push({x:100+c*75,y:60+r*45});
 let dir=1;
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)px-=6;
  if(keys.ArrowRight||keys.d)px+=6;
  if(keys[" "]&&game.fire!==true){bullets.push({x:px,y:400});game.fire=true}
  if(!keys[" "])game.fire=false;
  bullets.forEach(b=>b.y-=8);
  if(en.length&&Math.max(...en.map(e=>e.x))>770)dir=-1;
  if(en.length&&Math.min(...en.map(e=>e.x))<30)dir=1;
  en.forEach(e=>{e.x+=dir*.5});
  bullets.forEach(b=>en.forEach(e=>{
   if(Math.abs(b.x-e.x)<25&&Math.abs(b.y-e.y)<20)e.dead=true;
  }));
  en=en.filter(e=>!e.dead);
  bullets=bullets.filter(b=>b.y>0);
  en.forEach(e=>{circle(e.x,e.y,15,"#ff5577")});
  rect(px-25,410,50,15,"#65f7b1");
  bullets.forEach(b=>rect(b.x-2,b.y,4,12,"#fff"));
  text("Destroyed: "+(24-en.length),20,35);
  if(!en.length){text("YOU WIN!",330,220,35)}
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 7 ASTEROIDS */
function asteroids(){
 let x=400,y=225,a=0,bs=[],as=[];
 for(let i=0;i<7;i++)as.push({x:Math.random()*800,y:Math.random()*450,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2});
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)a-=.08;
  if(keys.ArrowRight||keys.d)a+=.08;
  if(keys.ArrowUp||keys.w){x+=Math.cos(a)*3;y+=Math.sin(a)*3}
  if(keys[" "]&&!game.fire){bs.push({x,y,vx:Math.cos(a)*7,vy:Math.sin(a)*7});game.fire=true}
  if(!keys[" "])game.fire=false;
  x=(x+800)%800;y=(y+450)%450;
  bs.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
  as.forEach(o=>{o.x=(o.x+o.vx+800)%800;o.y=(o.y+o.vy+450)%450});
  bs.forEach(b=>as.forEach(o=>{
   if(dist(b.x,b.y,o.x,o.y)<20)o.dead=true;
  }));
  as=as.filter(o=>!o.dead);
  as.forEach(o=>circle(o.x,o.y,18,"#ff5577"));
  circle(x,y,10,"#65f7b1");
  text("Asteroids: "+as.length,20,35);
  if(!as.length)text("SECTOR CLEARED!",280,220,30);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 8 TARGET HUNTER */
function targets(){
 let tx=100,ty=100,score=0,t=0;
 function loop(){
  clear();t++;
  tx=60+Math.random()*680;ty=70+Math.random()*320;
  circle(tx,ty,25,"#ff5577");
  circle(tx,ty,10,"#03070d");
  if(keys[" "]&&!game.fire){
   score++;game.fire=true;
   tx=Math.random()*700+50;ty=Math.random()*350+50;
  }
  if(!keys[" "])game.fire=false;
  text("Targets: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 9 CANNON */
function cannon(){
 let angle=-Math.PI/4,power=8,ball=null,target={x:650,y:350},score=0;
 function loop(){
  clear();
  if(keys.ArrowUp)angle-=.03;if(keys.ArrowDown)angle+=.03;
  if(keys[" "]&&!ball){ball={x:80,y:390,vx:Math.cos(angle)*power,vy:Math.sin(angle)*power};}
  if(ball){ball.vy+=.18;ball.x+=ball.vx;ball.y+=ball.vy}
  rect(50,390,70,20,"#65f7b1");
  circle(target.x,target.y,20,"#ff5577");
  if(ball)circle(ball.x,ball.y,9,"#ffd84d");
  if(ball&&dist(ball.x,ball.y,target.x,target.y)<25){
   score++;ball=null;target={x:450+Math.random()*300,y:80+Math.random()*300};
  }
  if(ball&&(ball.x>800||ball.y>450))ball=null;
  text("Hits: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 10 LASER */
function laser(){
 let px=400,en=[],score=0;
 for(let i=0;i<8;i++)en.push({x:50+i*100,y:80});
 function loop(){
  clear();
  if(keys.ArrowLeft||keys.a)px-=7;
  if(keys.ArrowRight||keys.d)px+=7;
  if(keys[" "]&&!game.fire){
   en=en.filter(e=>Math.abs(e.x-px)>30);score++;
   game.fire=true;
  }
  if(!keys[" "])game.fire=false;
  en.forEach(e=>{e.y+=Math.sin(Date.now()/300+e.x)*.5});
  en.forEach(e=>circle(e.x,e.y,15,"#ff5577"));
  rect(px-3,80,6,330,"#65f7b1");
  rect(px-25,410,50,12,"#fff");
  text("Hits: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 11 HIGHWAY RACER */
function racer(){
 let x=400,traffic=[],score=0;
 for(let i=0;i<7;i++)traffic.push({x:100+Math.random()*600,y:-i*100});

/* 21 2048 */
function game2048(){
 let a=Array(16).fill(0),score=0;
 a[Math.floor(Math.random()*16)]=2;
 function add(){let z=a.map((v,i)=>v?i:null).filter(v=>v!==null);if(z.length<16)a[z.length?z[Math.floor(Math.random()*z.length)]:0]=2}
 function move(dx,dy){
  let b=[...a];
  function line(arr){
   arr=arr.filter(Boolean);
   for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr[i+1]=0}
   return arr.filter(Boolean);
  }
  if(dx){
   for(let r=0;r<4;r++){
    let row=a.slice(r*4,r*4+4);row=line(row);
    while(row.length<4)dx>0?row.unshift(0):row.push(0);
    a.splice(r*4,4,...row);
   }
  }else{
   for(let c=0;c<4;c++){
    let col=[a[c],a[c+4],a[c+8],a[c+12]];col=line(col);
    while(col.length<4)dy>0?col.unshift(0):col.push(0);
    for(let r=0;r<4;r++)a[c+r*4]=col[r];
   }
  }
  if(JSON.stringify(a)!==JSON.stringify(b))add();
 }
 function loop(){
  clear();
  if(keys.ArrowLeft&&!game.l)move(-1,0);
  if(keys.ArrowRight&&!game.r)move(1,0);
  if(keys.ArrowUp&&!game.u)move(0,-1);
  if(keys.ArrowDown&&!game.d)move(0,1);
  game.l=keys.ArrowLeft;game.r=keys.ArrowRight;game.u=keys.ArrowUp;game.d=keys.ArrowDown;
  a.forEach((v,i)=>{rect(220+(i%4)*90,60+Math.floor(i/4)*90,80,80,v?"#65f7b1":"#182337");if(v)text(v,245+(i%4)*90,110+Math.floor(i/4)*90,24)});
  text("Score: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

  rect(200+(pos%5)*80+25,60+Math.floor(pos/5)*80+25,20,20,"#fff");
  text("Captured: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 40 MINESWEEPER */
function mine(){
 let mines=new Set();
 while(mines.size<8)mines.add(Math.floor(Math.random()*25));
 let opened=[];
 function loop(){
  clear();
  for(let i=0;i<25;i++){
   let x=200+(i%5)*80,y=60+Math.floor(i/5)*80;
   rect(x,y,70,70,opened.includes(i)?"#65f7b1":"#182337");
   if(opened.includes(i)&&mines.has(i))text("💣",x+20,y+48,25);
   if(keys[i+1]&&!game["m"+i]){
    game["m"+i]=true;
    if(mines.has(i))game.over=true;else opened.push(i);
   }
   if(!keys[i+1])game["m"+i]=false;
  }
  text("Use keys 1-9 to open tiles",20,35);
  if(game.over)text("BOOM — Press R",300,220,30);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 41 CONNECT FOUR */
function connect(){
 let board=Array(42).fill(0),turn=1;
 function loop(){
  clear();
  for(let i=0;i<42;i++){
   circle(230+(i%7)*55,70+Math.floor(i/7)*55,20,
     board[i]===1?"#65f7b1":board[i]===2?"#ff5577":"#172337");
  }
  text("Press 1-7 to drop your piece",250,430,18);
  for(let c=1;c<=7;c++){
   if(keys[c]&&!game["c"+c]){
    game["c"+c]=true;
    for(let r=5;r>=0;r--)if(!board[r*7+c-1]){board[r*7+c-1]=turn;turn=3-turn;break}
   }
   if(!keys[c])game["c"+c]=false;
  }
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 42 TIC TAC TOE */
function ttt(){
 let b=Array(9).fill(0),turn=1;
 function win(p){
  return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
   .some(a=>a.every(i=>b[i]===p));
 }
 function loop(){
  clear();
  for(let i=0;i<9;i++){
   rect(280+(i%3)*80,100+Math.floor(i/3)*80,70,70,"#172337");
   if(b[i])text(b[i]===1?"X":"O",305+(i%3)*80,150+Math.floor(i/3)*80,30);
   if(keys[i+1]&&!game["t"+i]&&!b[i]){
    b[i]=1;game["t"+i]=true;
    if(!win(1)){
     let free=b.map((v,j)=>v?null:j).filter(v=>v!==null);
     if(free.length)b[free[Math.floor(Math.random()*free.length)]]=2;
    }
   }
   if(!keys[i+1])game["t"+i]=false;
  }
  if(win(1))text("YOU WIN!",330,380,30);
  else if(win(2))text("COMPUTER WINS",300,380,30);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 44 FALLING BLOCKS */
function blocks(){

/* 45 BUBBLE POP */
function bubble(){
 let bs=[],score=0;
 function add(){bs.push({x:30+Math.random()*740,y:60+Math.random()*360,r:15+Math.random()*20})}
 for(let i=0;i<8;i++)add();
 function loop(){
  clear();
  bs.forEach(b=>circle(b.x,b.y,b.r,"#65f7b1"));
  canvas.onclick=e=>{
   let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*450/r.height;
   let i=bs.findIndex(b=>dist(x,y,b.x,b.y)<b.r);
   if(i>=0){bs.splice(i,1);score++;add()}
  };
  text("Popped: "+score,20,35);
  raf=requestAnimationFrame(loop);
 }loop();
}

/* 46 MOLE */
function mole(){

 }loop();
}

/* 50 SNOW */
function snow(){

 for(let i=0;i<7;i++)balls.push({x:Math.random()*800,y:-i*80,r:12});
 function loop(){
  clear();
